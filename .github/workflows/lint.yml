name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - feat/ci-cd

jobs:
  lint:
    name: Laravel Pint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run lint check
        run: ./vendor/bin/pint --test
